  # Neo4j (지식 그래프/매뉴얼 저장 및 GraphRAG용)
  neo4j:
    image: neo4j:enterprise
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/etch_final_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - sensor-network
    restart: unless-stopped

  # Postgres — 실시간 추론 결과 적재(inference_log) + 일일 리포트 집계 원천
  postgres:
    image: postgres:15-alpine
    container_name: etch-postgres
    environment:
      POSTGRES_USER: etch
      POSTGRES_PASSWORD: etch_pass
      POSTGRES_DB: etch_monitoring
    ports:
      - "5432:5432"    # 호스트의 server.py/worker가 localhost:5432로 접속
    volumes:
      - monitoring_pg_data:/var/lib/postgresql/data
    networks:
      - sensor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etch -d etch_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sensor-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  monitoring_pg_data: